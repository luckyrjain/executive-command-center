services:
  postgres:
    # pgvector/pgvector:pg18 is the official pgvector-maintained image --
    # postgres:18.0 plus the vector extension's shared library pre-built and
    # installed, so `CREATE EXTENSION vector` (migration 0015) succeeds.
    # Same PostgreSQL 18 core as the plain postgres:18.0 image Phase 1 used.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecc}
      POSTGRES_USER: ${POSTGRES_USER:-ecc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecc}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ecc_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecc} -d ${POSTGRES_DB:-ecc}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: runs migrations against `postgres` and exits. `backend`
  # depends on this completing successfully (not merely on `postgres`
  # being healthy) -- an architecture review found that without this,
  # `docker compose up`/`make dev` against a fresh, unmigrated database
  # started a `backend` whose `/health/live` reports healthy the whole
  # time (a pure liveness check, no DB query) while every real request
  # fails against a schema that was never created. `quickstart.sh` (the
  # documented one-command setup) already runs migrations as an explicit
  # host-side step before it starts the backend at all, so it was never
  # exposed to this gap -- this closes the same gap for the docker-compose
  # full-stack path.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ECC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecc}:${POSTGRES_PASSWORD:-ecc}@postgres:5432/${POSTGRES_DB:-ecc}
    command: ["/app/.venv/bin/alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ECC_ENV: ${ECC_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-ecc}
      POSTGRES_USER: ${POSTGRES_USER:-ecc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecc}
      ECC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecc}:${POSTGRES_PASSWORD:-ecc}@postgres:5432/${POSTGRES_DB:-ecc}
      ECC_SESSION_SECRET: ${ECC_SESSION_SECRET:-development-only-secret-change-before-real-data}
      ECC_CORS_ORIGINS: ${ECC_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      # Vite bundles vite.config.ts into a temp .mjs next to node_modules on
      # every dev-server start (unconditional for a .ts config, not
      # something project code controls), and separately keeps its own
      # dependency-pre-bundling cache under node_modules/.vite -- both
      # writes fail outright under read_only otherwise (confirmed via a
      # real container run: `EROFS: read-only file system, open
      # '/app/frontend/node_modules/.vite-temp/vite.config.ts.timestamp-...'`).
      # Scoped to exactly these two Vite-owned subdirectories, not all of
      # node_modules, so the actual installed dependencies stay the
      # image-baked, read-only copy `pnpm install` produced at build time.
      # `mode=1777` (not Docker's tmpfs default, which mounts root:root and
      # isn't writable by the container's own non-root `node` user) --
      # confirmed necessary via a real container run that still failed with
      # `EACCES` against an unmodified-mode tmpfs mount at these same paths.
      - /app/frontend/node_modules/.vite:mode=1777
      - /app/frontend/node_modules/.vite-temp:mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  ecc_postgres:
